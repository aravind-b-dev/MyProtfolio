<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- Primary Meta Tags -->
  <title>Aravind B | Senior Flutter Developer</title>
  <meta name="title" content="Aravind B | Senior Flutter Developer">
  <meta name="description" content="Senior Flutter Developer with 6 years experience engineering enterprise mobile & web applications, SBI YONO banking flows, clean architectures, and high-performance cross-platform software.">
  <meta name="keywords" content="Aravind B, Flutter Developer, Senior Flutter Engineer, Flutter Web, Dart, Clean Architecture, MobX, Enterprise Apps, Mobile Architect, Cross-Platform">
  <meta name="author" content="Aravind B">
  <meta name="theme-color" content="#080B10">

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aravind B | Senior Flutter Developer">
  <meta property="og:description" content="6 Years Experience Building Production Applications That Scale. Modern Flutter Web Portfolio.">
  <meta property="og:image" content="favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aravind B Portfolio">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Futuristic Preloader Styling -->
  <style>
    body {
      background-color: #080B10;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #00E5FF;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00E5FF;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 20px auto;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }
    .loading-text {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94A3B8;
      font-weight: 600;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-text">Initializing Experience...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
